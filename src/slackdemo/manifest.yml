display_information:
  name: Zundacord Voice UI Demo
  description: Block Kit demo of zundacord's /voice UI (live-updating message and modal)
  background_color: "#45b5ff"
features:
  bot_user:
    display_name: zundacord-demo
    always_online: false
  slash_commands:
    - command: /voice
      description: Set the speaker voice / style (Block Kit demo)
      usage_hint: "[dialog]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
